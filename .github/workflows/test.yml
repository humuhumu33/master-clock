name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Default-feature build (no_std spirit, foundational modules only).
  rust-default:
    name: rust default (no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --no-default-features
        run: cargo check --lib --no-default-features
      - name: cargo test --lib
        run: cargo test --lib

  # ─── Alloc-feature build — adds the wheel-30 sieve, π(N), and the
  # replicant-factorization counter.
  rust-alloc:
    name: rust alloc (sieve + π + replicants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --lib --features alloc
        run: cargo test --lib --features alloc

  # ─── Single-file integration suite (Phase 1 + 1.5 + 2 + 3).
  rust-integration:
    name: rust integration (validation suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --test validation
        run: cargo test --test validation --features alloc

  # ─── Cross-phase invariants — convergence under triality.
  rust-cross-phase:
    name: rust cross-phase invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: nine convergence tests (3×3 grid)
        run: cargo test --test cross_phase_invariants --features alloc
      - name: triality witnesses
        run: cargo test --test triality_witnesses

  # ─── Standalone validators — single-file Rust binaries that reproduce
  # every numerical claim without the crate.
  standalone-validators:
    name: standalone validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: validate sieve
        run: rustc -O validate_sieve.rs -o validate_sieve && ./validate_sieve
      - name: validate units of Z/9Z
        run: rustc -O validate_units_z9.rs -o validate_units_z9 && ./validate_units_z9
      - name: verify twin-prime rigor (11 check classes, 100k sweep)
        run: rustc -O verify_twin_rigor.rs -o verify_twin_rigor && ./verify_twin_rigor
      - name: verify Phase 3 batch
        run: rustc -O verify_phase3_batch.rs -o verify_phase3_batch && ./verify_phase3_batch
      - name: verify Phase 4 batch
        run: rustc -O verify_phase4_batch.rs -o verify_phase4_batch && ./verify_phase4_batch
      - name: verify Phase 5 batch
        run: rustc -O verify_phase5_batch.rs -o verify_phase5_batch && ./verify_phase5_batch

  # ─── Lean: zero-`sorry` static check. Fast, no toolchain install.
  lean-zero-sorry:
    name: lean zero-sorry guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: enforce zero sorry across lean4/
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          def strip_lean_comments(text: str) -> str:
              out = list(text)
              n = len(out)
              i = 0
              depth = 0
              while i < n:
                  c = out[i]
                  nxt = out[i + 1] if i + 1 < n else ""
                  if depth == 0:
                      if c == "/" and nxt == "-":
                          depth = 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "-" and nxt == "-":
                          while i < n and out[i] != "\n":
                              out[i] = " "
                              i += 1
                      else:
                          i += 1
                  else:
                      if c == "/" and nxt == "-":
                          depth += 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "-" and nxt == "/":
                          depth -= 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "\n":
                          i += 1
                      else:
                          out[i] = " "
                          i += 1
              return "".join(out)

          hits = []
          for path in pathlib.Path("lean4").rglob("*.lean"):
              text = path.read_text(encoding="utf-8")
              stripped = strip_lean_comments(text)
              for lineno, line in enumerate(stripped.splitlines(), start=1):
                  if re.search(r"\bsorry\b", line):
                      orig_lines = text.splitlines()
                      orig = orig_lines[lineno - 1] if lineno - 1 < len(orig_lines) else line
                      hits.append((path, lineno, orig.rstrip()))

          if hits:
              print(f"FAIL — {len(hits)} `sorry` token(s) found in proof bodies:")
              for path, lineno, line in hits:
                  print(f"  {path}:{lineno}: {line}")
              sys.exit(1)
          n_files = sum(1 for _ in pathlib.Path('lean4').rglob('*.lean'))
          print(f"OK — zero `sorry` across {n_files} Lean files.")
          PY

  # ─── Lean: full lake build. Slow (mathlib download). Continue-on-error
  # so a Lean toolchain hiccup doesn't block the Rust evidence.
  lean-lake-build:
    name: lean lake build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install elan + Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache lake build
        uses: actions/cache@v4
        with:
          path: |
            lean4/.lake
            lean4/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean4/lakefile.lean', 'lean4/lean-toolchain') }}
      - name: lake update + build
        working-directory: lean4
        run: |
          lake update
          lake exe cache get || echo "cache miss — will build from source"
          lake build
