name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Rust unit tests, default features (no_std-spirit, the smallest surface).
  rust-default:
    name: rust default (~112 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --lib
        run: cargo test --lib

  # ─── Rust unit tests, alloc feature (BRIDGE Layers 4–7 + TF + RF).
  rust-alloc:
    name: rust alloc (~167 tests + 2 ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --lib --features alloc
        run: cargo test --lib --features alloc

  # ─── Single-file integration suite + the printed validation report.
  rust-integration:
    name: rust integration (30 tests + summary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --test validation
        run: |
          OUTPUT=$(cargo test --test validation -- --nocapture validation_summary 2>&1)
          echo "$OUTPUT"
          {
            echo "## Phase 1+2+3 Validation Summary"
            echo ""
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── The headline empirical result.
  # Slow (~70s) because the rational `exp(-126)` Taylor series at BigInt
  # precision is the rate-limiting step. Output goes both to the run log
  # and to the run's "Summary" tab so reviewers see the residual table
  # without leaving GitHub.
  rust-live-evaluation:
    name: rust live Master-Clock (~70s, residual vs π(N))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: live Master-Clock evaluation
        run: |
          OUTPUT=$(cargo test --features alloc --test validation -- \
              --ignored --nocapture phase4_master_clock_residual_at_gary_n 2>&1)
          echo "$OUTPUT"
          {
            echo "## PHASE 4 — Live Master-Clock evaluation vs literature π(N)"
            echo ""
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload residual table as artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-output
          path: target/debug/deps/validation-*

  # ─── Lean: zero-`sorry` static check. Fast, no Lean toolchain install
  # required. Replicates `scripts/ci.sh` step 5 in a self-contained Python
  # block. Catches both `--` line comments and nested `/-! … -/` blocks.
  lean-zero-sorry:
    name: lean zero-sorry guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: enforce zero sorry across lean4/
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          def strip_lean_comments(text: str) -> str:
              out = list(text)
              n = len(out)
              i = 0
              depth = 0
              while i < n:
                  c = out[i]
                  nxt = out[i + 1] if i + 1 < n else ""
                  if depth == 0:
                      if c == "/" and nxt == "-":
                          depth = 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "-" and nxt == "-":
                          while i < n and out[i] != "\n":
                              out[i] = " "
                              i += 1
                      else:
                          i += 1
                  else:
                      if c == "/" and nxt == "-":
                          depth += 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "-" and nxt == "/":
                          depth -= 1
                          out[i] = " "; out[i + 1] = " "
                          i += 2
                      elif c == "\n":
                          i += 1
                      else:
                          out[i] = " "
                          i += 1
              return "".join(out)

          hits = []
          for path in pathlib.Path("lean4").rglob("*.lean"):
              text = path.read_text(encoding="utf-8")
              stripped = strip_lean_comments(text)
              for lineno, line in enumerate(stripped.splitlines(), start=1):
                  if re.search(r"\bsorry\b", line):
                      orig_lines = text.splitlines()
                      orig = orig_lines[lineno - 1] if lineno - 1 < len(orig_lines) else line
                      hits.append((path, lineno, orig.rstrip()))

          if hits:
              print(f"FAIL — {len(hits)} `sorry` token(s) found in proof bodies:")
              for path, lineno, line in hits:
                  print(f"  {path}:{lineno}: {line}")
              sys.exit(1)
          print(f"OK — zero `sorry` across {sum(1 for _ in pathlib.Path('lean4').rglob('*.lean'))} Lean files.")
          PY

  # ─── Lean: full lake build. Slow — first run downloads mathlib4 v4.23.0
  # (~2 GB) and compiles it. After that the cache makes runs ~3 min.
  # Marked `continue-on-error` so a Lean toolchain hiccup doesn't block
  # the Rust evidence; the zero-sorry guard above is the load-bearing
  # Lean check.
  lean-lake-build:
    name: lean lake build (mathlib v4.23.0)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install elan + Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache lake build
        uses: actions/cache@v4
        with:
          path: |
            lean4/.lake
            lean4/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean4/lakefile.lean', 'lean4/lean-toolchain') }}
      - name: lake update + build
        working-directory: lean4
        run: |
          lake update
          # Pull mathlib's pre-built cache so we don't compile it from source.
          lake exe cache get || echo "cache miss — will build from source"
          lake build
