[package]
name = "toroidal-prime-clock"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Strict Phase 1 encoding of Gary William Croft's published Prime Spiral Sieve. Anchored in the UOR Foundation; every constant derives from MODULUS_U=30 and NUMERAL_BASE=10 via standard number theory."
repository = "https://github.com/UOR-Foundation/prime-clock"
homepage = "https://uor.foundation/"
authors = ["UOR Foundation"]
publish = false

# Adheres to UOR-Framework discipline:
#   - #![no_std] core (host-only features behind explicit flags)
#   - no unsafe
#   - exact rationals only — no floating point
#   - all clippy warnings as errors
#   - doc-as-paper exposition
#
# Mirrors the lint posture of `uor-foundation` and `atlas-embeddings`.

[lib]
path = "src/lib.rs"

[dependencies]
uor-foundation = { git = "https://github.com/UOR-Foundation/UOR-Framework", branch = "main", default-features = false }
uor-foundation-sdk = { git = "https://github.com/UOR-Foundation/UOR-Framework", branch = "main" }

num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }

[dependencies.primal]
version = "0.3"
optional = true

[features]
default = []
alloc = []
ground-truth = ["alloc", "dep:primal"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
