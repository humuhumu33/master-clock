[package]
name = "uor-foundation-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Procedural-macro ergonomics for uor-foundation. Sandbox-mirror of UOR-Framework v0.3.0 SDK for Prime Clock smoke check."
repository = "https://github.com/UOR-Foundation/UOR-Framework"
homepage = "https://uor.foundation/"
authors = ["UOR Foundation"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
